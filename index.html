<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a" />
    <title>CDF Know Claw - AI Assistant</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- 预连接常用 API 域名，加速首屏加载 -->
    <link rel="preconnect" href="https://dashscope.aliyuncs.com" />
    <link rel="preconnect" href="https://api.openai.com" />
    <!-- 预加载关键字体 -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" />
    <style>
      #root-error {
        display: none; position: fixed; inset: 20%; z-index: 10000;
        padding: 24px; background: #fff; border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        font-family: -apple-system, system-ui, sans-serif;
        white-space: pre-wrap; word-break: break-all; font-size: 13px; color: #dc2626;
        overflow: auto;
      }
      #root-error.show { display: block; }
    </style>
  </head>
  <body>
    <!-- React 应用挂载点（启动画面由原生 AnimatedSplashView 负责，WebView 在后台加载，渲染完成后切换） -->
    <div id="root"></div>
    <!-- 错误显示区（main.tsx 渲染异常时填充） -->
    <div id="root-error" role="alert"></div>
    <!-- 开发环境下 Vite 自动注入客户端脚本 -->
    <!-- 生产环境下构建产物中包含完整脚本 -->
    <script type="module" src="/src/main.tsx"></script>
    <!-- 错误兜底：如果 JS 加载失败，显示提示信息 -->
    <noscript>
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: system-ui;">
        <div style="text-align: center; color: #666;">
          <h1>CDF Know Claw</h1>
          <p>请启用 JavaScript 以使用此应用</p>
        </div>
      </div>
    </noscript>
  </body>
</html>
