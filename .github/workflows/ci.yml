name: CI

on:
  push:
    branches: [main, master]
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      skip-dmg:
        description: 'Skip the macOS DMG build job (quality-gate only)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: write
  issues: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint (src + server)
        run: npm run lint

      - name: Check for unused dependencies
        run: npx depcheck || true

  static-checks:
    name: Static Checks (WKWebView / Perf / Packages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: WKWebView compatibility lint
        run: bash scripts/wkwebview-lint.sh || true

      - name: Performance lint
        run: bash scripts/perf-lint.sh || true

      - name: Package version contract check
        run: bash scripts/check-packages.sh || true

      - name: API contract check
        run: bash scripts/check-api-contracts.sh || true

      - name: CI health check
        run: bash scripts/ci-health-check.sh || true

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check frontend
        run: npx tsc --project tsconfig.json --noEmit

      - name: Prepare openclaw mock (if submodule absent)
        run: node scripts/ensure-openclaw-mock.cjs

      - name: Type check server
        run: npx tsc --project server/tsconfig.json --noEmit

  test:
    name: Unit Tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      ONNX_DISABLE_NATIVE_DOWNLOAD: '1'
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache vitest transform cache
        uses: actions/cache@v4
        with:
          path: .vitest-cache
          key: ${{ runner.os }}-vitest-${{ hashFiles('package-lock.json', 'vitest.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-vitest-

      - name: Run unit tests (vitest)
        run: npx vitest run --reporter=basic --no-color 2>&1 | tail -200

  engine-tests:
    name: Engine Tests (vitest engine config)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: true
      ONNX_DISABLE_NATIVE_DOWNLOAD: '1'
    steps:
      - name: Check out code (with openclaw submodule for real engine build)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # H1: engine 测试通过相对路径 import openclaw/test/helpers，以及 openclaw/dist/*
      # 的构建产物。先尝试真实构建 openclaw packages dist（成功则 engine 测试不再
      # continue-on-error，是真正的门禁）；若子模块构建失败则回退 mock，允许
      # non-blocking。
      - name: Build openclaw packages (real dist, preferred)
        id: build_openclaw
        continue-on-error: true
        run: |
          if [ -f "openclaw/package.json" ] && grep -q '"name": "@openclaw' openclaw/package.json 2>/dev/null; then
            echo "INFO: openclaw submodule present, building dist..."
            (cd openclaw && npm ci --legacy-peer-deps 2>&1 | tail -5 && npm run build:packages 2>&1 | tail -10)
          else
            echo "WARN: openclaw submodule missing or invalid, skip real build"
            exit 1
          fi

      - name: Prepare openclaw mock (fallback when real build unavailable)
        if: steps.build_openclaw.outcome != 'success'
        run: node scripts/ensure-openclaw-mock.cjs

      - name: Run engine tests
        run: npm run test:engine -- --reporter=basic --no-color 2>&1 | tail -300
        # H1: 真实 openclaw dist 构建成功时 engine 测试为硬门禁；mock 模式仍宽容
        continue-on-error: ${{ steps.build_openclaw.outcome != 'success' }}

  # H4: P2-1 API 契约测试门禁 — 校验所有 respond / errorHandler envelope 一致性。
  # 测试不依赖 DB / supertest（内存 mock），运行成本极低，作为 lint 级硬门禁。
  contract-tests:
    name: P2-1 API Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      ONNX_DISABLE_NATIVE_DOWNLOAD: '1'
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run contract tests (envelope = { code, data, message })
        run: npm run test:contracts -- --reporter=basic --no-color 2>&1 | tail -200

  # P1-4: verify.mjs (Playwright) 接入 CI — 替代旧 CLI check+test 流程。
  # 审计主前端 /wiki 与 /extensions-center 视觉一致性（DOM 结构 + 样式）。
  # 软门禁 (continue-on-error)：UI 一致性为趋势指标，不阻塞主流程；仅 PR 触发。
  ui-visual-verify:
    name: UI Visual Consistency (verify.mjs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck]
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        run: npm run dev -- --host 127.0.0.1 --port 5173 &
        env:
          CI: true

      - name: Wait for server ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:5173 > /dev/null; then
              echo "Server ready"
              break
            fi
            echo "Waiting ($i/30)"
            sleep 2
          done

      - name: Run visual verify (verify.mjs)
        run: node scripts/verify.mjs
        env:
          VERIFY_BASE_URL: 'http://127.0.0.1:5173'

  deadcode:
    name: Dead Code (knip)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run knip
        run: npx knip --include files,dependencies,exports,types || true

  e2e-api-test:
    name: E2E API Tests (without Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run API E2E tests
        run: npx vitest run --reporter=basic server/__tests__/e2e-*.test.ts || true

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, e2e-api-test, static-checks]
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend for metrics
        id: build
        run: |
          START=$(date +%s%3N)
          npm run build
          END=$(date +%s%3N)
          echo "build_time_ms=$((END - START))" >> "$GITHUB_OUTPUT"

      - name: Measure bundle size
        id: bundle-size
        run: |
          if [ -d dist/ ]; then
            JS_SIZE=$(find dist/ -type f -name "*.js" -exec du -k {} + | awk '{s+=$1} END {printf "%.0f", s+0}')
            CSS_SIZE=$(find dist/ -type f -name "*.css" -exec du -k {} + | awk '{s+=$1} END {printf "%.0f", s+0}')
          else
            JS_SIZE=0; CSS_SIZE=0
          fi
          [ -z "$JS_SIZE" ] && JS_SIZE=0
          [ -z "$CSS_SIZE" ] && CSS_SIZE=0
          TOTAL=$((JS_SIZE + CSS_SIZE))
          MAX_SIZE=15000
          echo "total_size_kb=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "js_size_kb=$JS_SIZE" >> "$GITHUB_OUTPUT"
          echo "css_size_kb=$CSS_SIZE" >> "$GITHUB_OUTPUT"
          echo "JS: ${JS_SIZE}KB, CSS: ${CSS_SIZE}KB"
          FILE_COUNT=$(find dist/ -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$TOTAL" -gt "$MAX_SIZE" ]; then
            echo "::warning::Bundle size exceeds ${MAX_SIZE}KB (current: ${TOTAL}KB)"
          fi

      - name: Post build performance comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildTime = parseInt('${{ steps.build.outputs.build_time_ms }}', 10) || 0;
            const totalSize = parseInt('${{ steps.bundle-size.outputs.total_size_kb }}', 10) || 0;
            const jsSize = parseInt('${{ steps.bundle-size.outputs.js_size_kb }}', 10) || 0;
            const cssSize = parseInt('${{ steps.bundle-size.outputs.css_size_kb }}', 10) || 0;
            const files = parseInt('${{ steps.bundle-size.outputs.file_count }}', 10) || 0;
            const body = `### Build Performance Summary\n- Build time: ${buildTime}ms\n- Total bundle size: ${totalSize}KB (JS ${jsSize}KB / CSS ${cssSize}KB)\n- Files: ${files}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            }).catch(() => {});

  build-dmg:
    name: Build macOS DMG
    # 优化：needs 中仅保留真正依赖的 4 个核心门禁（移除 test）。
    # GitHub Actions 会等待 needs 中所有 job 达到最终状态后才评估 if；
    # 之前即使 if 不看 test 结果，仍要等 25 分钟的 vitest。现在只要
    # lint/typecheck/e2e-api/static-checks 完成就立刻启动 DMG 构建。
    needs: [lint, typecheck, e2e-api-test, static-checks]
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      (github.ref_name == 'main' || github.ref_name == 'master') &&
      inputs.skip-dmg != 'true' &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs.e2e-api-test.result == 'success' &&
      needs.static-checks.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 与 Type Check job 保持一致：submodules=false 的 CI 上没有真实 openclaw，
      # 需要扫描 @openclaw-src/* 导入并生成 stub 文件，否则 esbuild（Pre-build check 第 5 步）
      # 会因 Cannot resolve "@openclaw-src/agents/sessions/session-manager.js" 等错误失败。
      - name: Prepare openclaw mock (if submodule absent)
        run: node scripts/ensure-openclaw-mock.cjs

      - name: Build frontend
        run: npm run build

      - name: Pre-build check
        run: bash scripts/pre-build-check.sh --quick

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0.3'

      - name: Cache Swift Package
        uses: actions/cache@v4
        with:
          path: apps/macos/.build
          key: ${{ runner.os }}-swift-6.0.3-spm-release-${{ hashFiles('apps/macos/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-6.0.3-spm-release-
            ${{ runner.os }}-swift-6.0.3-spm-

      - name: Build macOS app + DMG
        run: bash scripts/package-mac-dist.sh --no-bump --skip-release
        env:
          CI: true

      - name: Get version
        id: get_version
        run: echo "version=$(node -e "console.log(require('./package.json').version)")" >> $GITHUB_OUTPUT

      - name: Verify DMG
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          DMG_FILE="release/CDF Know Clow-${VERSION}.dmg"
          if [ ! -f "$DMG_FILE" ]; then
            echo "::error::DMG not found: $DMG_FILE"
            ls -la release/ 2>/dev/null || true
            exit 1
          fi
          DMG_SIZE=$(stat -f%z "$DMG_FILE" 2>/dev/null || stat -c%s "$DMG_FILE" 2>/dev/null)
          if [ "$DMG_SIZE" -lt 1000000 ]; then
            echo "::error::DMG is suspiciously small (${DMG_SIZE} bytes)"
            exit 1
          fi
          echo "✅ DMG verified: $DMG_FILE ($DMG_SIZE bytes)"

      - name: Compute SHA256
        id: sha
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          DMG_FILE="release/CDF Know Clow-${VERSION}.dmg"
          SHA256=$(shasum -a 256 "$DMG_FILE" | awk '{print $1}')
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "SHA256: ${SHA256}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDF-Know-Clow-${{ steps.get_version.outputs.version }}-mac.dmg
          path: |
            release/CDF Know Clow-${{ steps.get_version.outputs.version }}.dmg
            release/release.json
          retention-days: 30

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          VERSION="${{ steps.get_version.outputs.version }}"

          {
            echo "RELEASE_NOTES<<EOF"
            echo "## CDF Know Clow v${VERSION}"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### Changes since ${PREV_TAG}"
              git log ${PREV_TAG}..HEAD --oneline --no-merges | sed 's/^/- /'
            else
              echo "Initial release"
            fi
            echo ""
            echo "### Download"
            echo "- **macOS**: CDF Know Clow-${VERSION}.dmg"
            echo "- **SHA256**: \`${{ steps.sha.outputs.sha256 }}\`"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Create Git Tag
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git tag -l "v${VERSION}" | grep -q "v${VERSION}"; then
            echo "Tag v${VERSION} already exists"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}" 2>/dev/null || echo "Tag push skipped"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: CDF Know Clow v${{ steps.get_version.outputs.version }}
          body: ${{ env.RELEASE_NOTES }}
          files: |
            release/CDF Know Clow-${{ steps.get_version.outputs.version }}.dmg
            release/release.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
