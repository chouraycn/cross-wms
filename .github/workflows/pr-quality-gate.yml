name: PR Quality Gate

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

# P0-①: 所有检查 job 并行执行（无 needs 依赖），仅 e2e-test 等待构建完成
# P0-⑥: 使用 composite action 复用 checkout+setup+npm ci，消除重复
# P2-⑩: Quick-CI 与 PR-Gate 共用 .github/actions/setup-node-deps
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup-node-deps
      - name: Run oxlint (src + server)
        run: npm run lint:ox
      - name: Run ESLint (src + server)
        run: npm run lint
      - name: Check for unused dependencies
        run: npx depcheck || true

  deadcode:
    name: Dead Code (knip)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # P0-①: 不再 needs lint，直接并行执行
    if: github.event_name == 'pull_request'
    steps:
      - uses: ./.github/actions/setup-node-deps
      - name: Run knip dead-code analysis
        run: npm run deadcode

  static-checks:
    name: Static Checks (WKWebView / Perf / Packages)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: ./.github/actions/setup-node-deps
      - name: Make scripts executable
        run: chmod +x scripts/*.sh
      - name: WKWebView compatibility lint
        run: bash scripts/wkwebview-lint.sh
      - name: Performance lint
        run: bash scripts/perf-lint.sh
      - name: Package version contract check
        run: bash scripts/check-packages.sh
      - name: API contract check
        run: bash scripts/check-api-contracts.sh
      - name: CI health check
        run: bash scripts/ci-health-check.sh

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup-node-deps
      - name: Type check frontend
        run: npx tsc --noEmit
      - name: Type check backend
        run: npx tsc --noEmit --project server/tsconfig.json

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ONNX_DISABLE_NATIVE_DOWNLOAD: '1'
    steps:
      - uses: ./.github/actions/setup-node-deps
      - name: Run tests with coverage
        run: npm run test:ci -- --passWithNoTests
      - name: Check coverage thresholds
        run: |
          COVERAGE_JSON=$(cat coverage/coverage-summary.json 2>/dev/null || echo '{}')
          LINES=$(echo "$COVERAGE_JSON" | jq -r '.total.lines.pct // 0')
          FUNCTIONS=$(echo "$COVERAGE_JSON" | jq -r '.total.functions.pct // 0')
          BRANCHES=$(echo "$COVERAGE_JSON" | jq -r '.total.branches.pct // 0')
          STATEMENTS=$(echo "$COVERAGE_JSON" | jq -r '.total.statements.pct // 0')

          echo "Coverage Report:"
          echo "Lines: $LINES%"
          echo "Functions: $FUNCTIONS%"
          echo "Branches: $BRANCHES%"
          echo "Statements: $STATEMENTS%"

          MIN_LINES=40
          MIN_FUNCTIONS=50
          MIN_BRANCHES=45
          MIN_STATEMENTS=40

          if (( $(echo "$LINES < $MIN_LINES" | bc -l) )); then
            echo "::error::Lines coverage ($LINES%) below threshold ($MIN_LINES%)"
            exit 1
          fi
          if (( $(echo "$FUNCTIONS < $MIN_FUNCTIONS" | bc -l) )); then
            echo "::error::Functions coverage ($FUNCTIONS%) below threshold ($MIN_FUNCTIONS%)"
            exit 1
          fi
          if (( $(echo "$BRANCHES < $MIN_BRANCHES" | bc -l) )); then
            echo "::error::Branches coverage ($BRANCHES%) below threshold ($MIN_BRANCHES%)"
            exit 1
          fi
          if (( $(echo "$STATEMENTS < $MIN_STATEMENTS" | bc -l) )); then
            echo "::error::Statements coverage ($STATEMENTS%) below threshold ($MIN_STATEMENTS%)"
            exit 1
          fi
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  e2e-api-test:
    name: E2E API Test (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # P0-①: 不再 needs [lint, typecheck]，直接并行
    env:
      ONNX_DISABLE_NATIVE_DOWNLOAD: '1'
    steps:
      - uses: ./.github/actions/setup-node-deps
      - name: Run E2E API tests (regression gate)
        run: npm run test:e2e:api -- --passWithNoTests 2>&1 | tee e2e-api-output.log
      - name: Check E2E pass rate (>= 95%)
        if: always()
        run: |
          if [ ! -f e2e-results/api-results.json ]; then
            echo "::warning::E2E results JSON not found, skipping pass rate check"
            exit 0
          fi
          TOTAL=$(jq '.numTotalTests' e2e-results/api-results.json 2>/dev/null || echo 0)
          PASSED=$(jq '.numPassedTests' e2e-results/api-results.json 2>/dev/null || echo 0)
          FAILED=$(jq '.numFailedTests' e2e-results/api-results.json 2>/dev/null || echo 0)
          if [ "$TOTAL" -eq 0 ]; then
            echo "::warning::No E2E tests executed"
            exit 0
          fi
          PASS_RATE=$(echo "scale=1; $PASSED * 100 / $TOTAL" | bc)
          echo "E2E Pass Rate: ${PASSED}/${TOTAL} (${PASS_RATE}%)"
          echo "Failed: ${FAILED}"
          THRESHOLD=95
          if (( $(echo "$PASS_RATE < $THRESHOLD" | bc -l) )); then
            echo "::error::E2E pass rate (${PASS_RATE}%) below threshold (${THRESHOLD}%)"
            exit 1
          fi
          echo "✅ E2E pass rate ${PASS_RATE}% meets threshold ${THRESHOLD}%"
      - name: Upload E2E API results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-api-results
          path: |
            e2e-api-output.log
            e2e-results/api-results.json
          retention-days: 7

  # P0-①: 构建不再等待测试完成，直接并行启动
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/setup-node-deps
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            dist/
            node_modules/.vite/
          key: ${{ runner.os }}-vite-build-v2-${{ hashFiles('**/package-lock.json', 'src/**', 'vite.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-build-v2-${{ hashFiles('**/package-lock.json', 'vite.config.ts', 'tsconfig.json') }}
            ${{ runner.os }}-vite-build-v2-${{ hashFiles('**/package-lock.json') }}
            ${{ runner.os }}-vite-build-v2-
      - name: Build frontend (vite)
        id: build
        run: |
          START_TIME=$(date +%s%N)
          npm run build 2>&1 | tee build-output.log
          END_TIME=$(date +%s%N)
          BUILD_TIME_MS=$(( (END_TIME - START_TIME) / 1000000 ))
          echo "build_time_ms=$BUILD_TIME_MS" >> "$GITHUB_OUTPUT"
          echo "Build time: ${BUILD_TIME_MS}ms"
      - name: Check build warnings
        run: |
          WARNING_COUNT=$(grep -c "warning" build-output.log || echo 0)
          ERROR_COUNT=$(grep -c "error" build-output.log || echo 0)
          echo "Build warnings: $WARNING_COUNT"
          echo "Build errors: $ERROR_COUNT"
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::error::Build contains errors"
            exit 1
          fi
      - name: Check bundle size
        id: bundle-size
        run: |
          TOTAL_SIZE=$(du -sk dist/ | cut -f1)
          MAX_SIZE=50000
          echo "Bundle size: ${TOTAL_SIZE}KB"
          echo "total_size_kb=$TOTAL_SIZE" >> "$GITHUB_OUTPUT"
          
          JS_SIZE=$(find dist/ -name '*.js' -exec du -sk {} + | awk '{sum+=$1} END {print sum+0}')
          CSS_SIZE=$(find dist/ -name '*.css' -exec du -sk {} + | awk '{sum+=$1} END {print sum+0}')
          echo "js_size_kb=$JS_SIZE" >> "$GITHUB_OUTPUT"
          echo "css_size_kb=$CSS_SIZE" >> "$GITHUB_OUTPUT"
          echo "JS: ${JS_SIZE}KB, CSS: ${CSS_SIZE}KB"
          
          FILE_COUNT=$(find dist/ -type f | wc -l)
          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"
          
          if [ "$TOTAL_SIZE" -gt "$MAX_SIZE" ]; then
            echo "::warning::Bundle size exceeds ${MAX_SIZE}KB (current: ${TOTAL_SIZE}KB)"
          fi
      - name: Post build performance comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildTime = parseInt('${{ steps.build.outputs.build_time_ms }}', 10);
            const totalSize = parseInt('${{ steps.bundle-size.outputs.total_size_kb }}', 10);
            const jsSize = parseInt('${{ steps.bundle-size.outputs.js_size_kb }}', 10);
            const cssSize = parseInt('${{ steps.bundle-size.outputs.css_size_kb }}', 10);
            const fileCount = parseInt('${{ steps.bundle-size.outputs.file_count }}', 10);
            
            const formatSize = (kb) => kb >= 1024 ? `${(kb / 1024).toFixed(2)} MB` : `${kb} KB`;
            const formatTime = (ms) => ms >= 1000 ? `${(ms / 1000).toFixed(2)}s` : `${ms}ms`;
            
            const commentBody = `## 📊 Build Performance Report
            
            | Metric | Value |
            |--------|-------|
            | **Build Time** | ⏱️ ${formatTime(buildTime)} |
            | **Total Bundle Size** | 📦 ${formatSize(totalSize)} |
            | **JavaScript** | 📜 ${formatSize(jsSize)} |
            | **CSS** | 🎨 ${formatSize(cssSize)} |
            | **File Count** | 📁 ${fileCount} files |
            
            > Generated from commit \`${context.sha.substring(0, 7)}\`
            `;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existingComment = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('Build Performance Report')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          retention-days: 7

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup-node-deps
      - name: Build backend (esbuild)
        run: |
          ./node_modules/.bin/esbuild server/index.ts \
            --bundle \
            --platform=node \
            --target=node22 \
            --format=cjs \
            --outfile=/tmp/cdf-server-bundle.cjs \
            --alias:@src=$(pwd)/src \
            --external:better-sqlite3 \
            '--external:@cdfclaw/*' \
            --external:@modelcontextprotocol/sdk \
            --external:json5 \
            --external:onnxruntime-node \
            --external:fsevents \
            --external:@mozilla/readability \
            --external:turndown \
            --external:jsdom \
            --external:@mixmark-io/domino \
            --external:cheerio \
            --external:tr46 \
            --external:whatwg-url \
            --external:sqlite-vec \
            --sourcemap=inline \
            2>&1 | tee backend-build.log
      - name: Verify backend bundle
        run: |
          if [ ! -f /tmp/cdf-server-bundle.cjs ]; then
            echo "::error::Backend bundle not produced"
            exit 1
          fi
          BUNDLE_SIZE=$(stat -c%s /tmp/cdf-server-bundle.cjs 2>/dev/null || stat -f%z /tmp/cdf-server-bundle.cjs 2>/dev/null)
          echo "Backend bundle size: $((BUNDLE_SIZE / 1024 / 1024))MB"
          if [ "$BUNDLE_SIZE" -lt 100000 ]; then
            echo "::error::Backend bundle is suspiciously small ($BUNDLE_SIZE bytes)"
            exit 1
          fi
          node -c /tmp/cdf-server-bundle.cjs
          echo "✅ Backend bundle verified"

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup-node-deps
      - name: Run npm audit (fail on critical)
        run: npm audit --audit-level=critical
      - name: Run dependency vulnerability scan
        run: npx snyk test --severity-threshold=critical || true
      - name: Check for outdated dependencies (info only)
        run: npm outdated || true
        if: always()

  # P1-③: Playwright UI E2E 分片并行执行（4 shards）
  e2e-test:
    name: E2E UI Test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-build, backend-build]
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    env:
      ONNX_DISABLE_NATIVE_DOWNLOAD: '1'
    steps:
      - uses: ./.github/actions/setup-node-deps
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests (shard ${{ matrix.shard }})
        run: npx playwright test --config=e2e/playwright.config.ts --shard=${{ matrix.shard }} 2>&1 | tee e2e-output-${{ matrix.shard }}.log
      - name: Merge shard results
        if: always()
        run: |
          mkdir -p e2e-results
          cp e2e-output-${{ matrix.shard }}.log e2e-results/ 2>/dev/null || true
      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            e2e-output-${{ matrix.shard }}.log
            e2e-results/
          retention-days: 7

  # P2-④: Flaky test 检测 — 对核心测试运行 2 次重试，识别不稳定测试
  flaky-test-detection:
    name: Flaky Test Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ONNX_DISABLE_NATIVE_DOWNLOAD: '1'
    steps:
      - uses: ./.github/actions/setup-node-deps
      - name: Run tests with retry (detect flaky tests)
        run: |
          npx vitest run --retry=2 --reporter=json --outputFile=flaky-results.json 2>&1 | tee flaky-output.log || true
          
          if [ -f flaky-results.json ]; then
            TOTAL=$(jq '.numTotalTests' flaky-results.json 2>/dev/null || echo 0)
            RETRIED=$(jq '.testResults | map(.retryCount // 0) | add // 0' flaky-results.json 2>/dev/null || echo 0)
            echo "Total tests: $TOTAL"
            echo "Retried tests: $RETRIED"
            if [ "$RETRIED" -gt 0 ]; then
              echo "::warning::$RETRIED tests required retry (potential flaky tests)"
              # List flaky test names
              jq -r '.testResults[] | select(.retryCount > 0) | .name' flaky-results.json 2>/dev/null || true
            else
              echo "✅ No flaky tests detected"
            fi
          fi
      - name: Upload flaky test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-test-report
          path: |
            flaky-output.log
            flaky-results.json
          retention-days: 14
          if-no-files-found: warn

  swift-test:
    name: Swift Test (6.0.3)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Check for Swift changes
        id: swift_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            swift:
              - 'apps/macos/**'
              - 'scripts/package-mac*.sh'
              - 'scripts/build-macos-swift.sh'
              - 'scripts/create-dmg.sh'
              - 'scripts/codesign-mac-app.sh'
      - name: Select Xcode
        if: steps.swift_changes.outputs.swift == 'true'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Set up Swift
        if: steps.swift_changes.outputs.swift == 'true'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0.3'
      - name: Cache Swift Package
        if: steps.swift_changes.outputs.swift == 'true'
        uses: actions/cache@v4
        with:
          path: apps/macos/.build
          key: ${{ runner.os }}-swift-6.0.3-spm-${{ hashFiles('apps/macos/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-6.0.3-spm-
      - name: Resolve Dependencies
        if: steps.swift_changes.outputs.swift == 'true'
        run: swift package resolve
        working-directory: apps/macos
      - name: Build
        if: steps.swift_changes.outputs.swift == 'true'
        run: swift build --build-tests
        working-directory: apps/macos
      - name: Run Tests
        if: steps.swift_changes.outputs.swift == 'true'
        run: swift test --disable-sandbox 2>&1 | tee test-output.log
        working-directory: apps/macos
      - name: Skip (no Swift changes)
        if: steps.swift_changes.outputs.swift != 'true'
        run: echo "No Swift-related changes detected, skipping Swift tests."
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always() && steps.swift_changes.outputs.swift == 'true'
        with:
          name: swift-test-results
          path: apps/macos/test-output.log
          retention-days: 7
